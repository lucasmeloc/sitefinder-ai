label{font-size:12px;color:var(--mu);font-weight:600;display:block;margin-bottom:3px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
button.g:hover,a.g:hover{border-color:var(--pr)}a.g{border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:13px;text-decoration:none;display:inline-block}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.sem{background:#e5484d22;color:var(--red)}.com{background:#1f9d5522;color:var(--grn)}.ver{background:#d99a0022;color:var(--yel)}

.mu{color:var(--mu);font-size:13px}.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.chart div.r{display:grid;grid-template-columns:110px 1fr 30px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.score{font-weight:800;font-size:20px;color:var(--pr)}
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}.kan>div{min-width:230px;flex:1}.kan .card{padding:10px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}.modal.on{display:flex}
.modal .card{max-width:640px;width:100%;max-height:90vh;overflow:auto}
.chk{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0}.chk label{display:flex;gap:5px;align-items:center;color:var(--tx);font-size:13px;margin:0}.chk input{width:auto}
svg text{fill:var(--mu);font-size:11px}
.empty{text-align:center;color:var(--mu);padding:40px}
.tw{overflow-x:auto}

 return`<h2>Pesquisa inteligente</h2><div class="card">${dls()}<div id="chips" hidden></div><div class="form"><div><label>País</label><select id="q_pais">${PAIS.map(p=>`<option value="${p[0]}">${p[1]} (+${p[2]})</option>`).join('')}</select></div><div><label>Cidade</label><input id="q_city" list="dl_city" value="Lagoa da Prata" placeholder="Qualquer cidade do Brasil" autocomplete="off"></div><div><label>Estado / Região</label><input id="q_uf" list="dl_uf" value="MG"></div><div><label>Bairro</label><input id="q_bai"></div><div><label>CEP (opcional)</label><input id="q_cep"></div><div><label>Segmento</label><select id="q_seg">${SEGS.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Raio (km)</label><input id="q_rad" type="number" value="10" min="1"></div><div><label>Quantidade</label><input id="q_qty" type="number" value="12" min="1" max="60"></div><button class="b" data-a="search">🔎 Pesquisar</button></div>

 <div class="chk">${[['wa','Possui WhatsApp'],['ig','Possui Instagram'],['tel','Possui telefone'],['em','Possui e-mail']].map(([k,t])=>`<label><input type="checkbox" data-f="${k}">${t}</label>`).join('')}</div></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="mu">${list.length} de ${results.length} resultados</span><button class="g" data-a="export">⬇ Exportar</button></div>

opp(){const l=results.map(b=>({b,s:score(b)})).filter(x=>x.s.n>=50).sort((a,b)=>b.s.n-a.s.n);

crm(){const ls=Object.values(leads);return`<h2>CRM de prospecção</h2>${ls.length?`<div class="kan">${STAGES.map(s=>`<div><h3>${s} (${ls.filter(l=>l.stage===s).length})</h3>${ls.filter(l=>l.stage===s).map(l=>`<div class="card"><b>${l.b.name}</b><div class="mu">${l.b.cat}${l.value?' · R$ '+l.value:''}</div>${l.next?`<div class="mu">Retorno: ${l.next}</div>`:''}<div>${l.tags.map(t=>`<span class="tag ver">${t}</span>`).join(' ')}</div><button class="g" style="margin-top:6px" data-a="lead" data-id="${l.b.id}">Abrir</button></div>`).join('')}</div>`).join('')}</div>`:'<div class="empty">Nenhum lead. Use “+ CRM” nos resultados.</div>'}`},

const BRL=v=>'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function salesBlock(){const tot=sales.reduce((a,s)=>a+s.v,0),mo=new Date().toISOString().slice(0,7),mt=sales.filter(s=>s.d.startsWith(mo)).reduce((a,s)=>a+s.v,0),tk=sales.length?tot/sales.length:0;
 const days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10);return[d,sales.filter(s=>s.d===d).reduce((a,s)=>a+s.v,0)]}),mx=Math.max(1,...days.map(x=>x[1]));
 return`<div class="card" style="margin-bottom:12px;border-color:var(--grn)"><h3>💰 Vendas</h3><div class="grid kpis"><div class="kpi"><b>${BRL(tot)}</b><span>Faturamento total</span></div><div class="kpi"><b>${sales.length}</b><span>Vendas aprovadas</span></div><div class="kpi"><b>${BRL(tk)}</b><span>Ticket médio</span></div><div class="kpi"><b>${BRL(mt)}</b><span>Neste mês</span></div></div><div style="display:flex;align-items:flex-end;gap:4px;height:90px;margin:14px 0 4px">${days.map(([d,v])=>`<div title="${d}: ${BRL(v)}" style="flex:1;background:${v?'var(--grn)':'var(--bd)'};height:${v?Math.max(8,v/mx*100):4}%;border-radius:3px"></div>`).join('')}</div><div class="mu">Últimos 14 dias</div><h3 style="margin-top:12px">Vendas recentes</h3>${sales.length?[...sales].reverse().slice(0,8).map(s=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)"><span><b>${s.n}</b> <span class="mu">${s.d.split('-').reverse().join('/')} · ${s.m}</span></span><span><b style="color:var(--grn)">${BRL(s.v)}</b> <button class="g" data-a="rsale" data-id="${s.id}">Estornar</button></span></div>`).join(''):'<div class="mu">Nenhuma venda ainda. Use “💰 Vendi” em um estabelecimento.</div>'}</div>`}
function saleModal(id){const b=find(id),l=leads[id];modal(`<h3>💰 Registrar venda: ${b.name}</h3><div class="form"><div><label>Valor da venda (R$)</label><input id="s_v" type="number" step="0.01" value="${l&&l.value||''}"></div><div><label>Data</label><input id="s_d" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Pagamento</label><select id="s_m"><option>Pix</option><option>Cartão</option><option>Boleto</option><option>Dinheiro</option><option>Transferência</option></select></div></div><div class="acts" style="margin-top:12px"><button class="b" data-a="csale" data-id="${id}">Confirmar venda</button><button class="g" data-a="close">Cancelar</button></div>`)}
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--grn);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;z-index:30;box-shadow:0 8px 24px #0004';document.body.append(e);setTimeout(()=>e.remove(),4000)}
const TABS=[['dash','Dashboard'],['search','Pesquisar'],['opp','Oportunidades'],['crm','CRM'],['map','Mapa'],['plans','Planos']];

 document.querySelectorAll('[data-f]').forEach(e=>{const v=flt[e.dataset.f];if(e.type==='checkbox')e.checked=!!v;else e.value=v||''})}
const modal=h=>{$('#mbody').innerHTML=h;$('#modal').classList.add('on')},close=()=>$('#modal').classList.remove('on');
const copy=t=>{try{navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}};
function aiModal(id){const b=find(id),s=score(b),first=b.name;
 const msg=b.st==='com'?`Olá, equipe da ${first}! Tudo bem? Vi o site de vocês e identifiquei oportunidades de melhoria em velocidade, versão mobile e geração de contatos. Trabalho com sites profissionais e posso enviar uma análise gratuita. Posso mandar?`:`Olá! Tudo bem? Encontrei a ${first} na internet e percebi que não identifiquei um site próprio${b.ig?', apenas o Instagram '+b.ig:''}. Trabalho com criação de sites profissionais para ${b.cat.toLowerCase()} e gostaria de apresentar uma ideia para ajudar vocês a conquistar mais clientes pela internet. Posso enviar um exemplo?`;
 const gaps=[!b.site&&'Sem site próprio identificado',!b.email&&'Sem e-mail público',!b.wa&&'WhatsApp não identificado',!b.ig&&'Sem Instagram',!b.fb&&'Sem Facebook',!b.rev&&'Sem avaliações no Google'].filter(Boolean);
 const model={Restaurante:'cardápio digital com reservas',Pizzaria:'pedidos online e cardápio',Barbearia:'agendamento online e galeria',Padaria:'vitrine de produtos e encomendas','Salão de beleza':'agendamento e portfólio','Clínica odontológica':'agendamento e depoimentos'}[b.cat]||'página institucional com contato direto e Google Maps';
 modal(`<h3>✨ IA para ${b.name}</h3><label>Mensagem de abordagem (edite antes de enviar)</label><textarea id="ai_msg" rows="6">${msg}</textarea><div class="acts" style="margin:6px 0 12px"><button class="b" data-a="cp" data-s="ai_msg">Copiar</button></div>
 <h3>Presença digital</h3><div class="mu">Pontuação de oportunidade: <b>${s.n}/100</b></div><ul class="mu" style="padding-left:18px">${gaps.map(g=>`<li>${g}</li>`).join('')||'<li>Presença completa</li>'}</ul>
 <h3 style="margin-top:10px">Modelo sugerido</h3><div class="mu">Site com ${model}, botão de WhatsApp, avaliações do Google e SEO local.</div>
 <h3 style="margin-top:10px">Argumentos de venda</h3><ul class="mu" style="padding-left:18px"><li>Clientes procuram ${b.cat.toLowerCase()} no Google antes de visitar.</li><li>${b.rev?`Com ${b.rev} avaliações, já há reputação para converter em visitas.`:'Um site cria credibilidade desde as primeiras avaliações.'}</li><li>Um domínio próprio não depende de algoritmo de rede social.</li></ul>
 <h3 style="margin-top:10px">Proposta e preço</h3><div class="form"><div><label>Valor base (R$)</label><input id="ai_base" type="number" value="1500"></div><div><label>Páginas</label><input id="ai_pg" type="number" value="5"></div><div><label><input type="checkbox" id="ai_sh" style="width:auto"> Agendamento/pedidos</label></div><button class="b" data-a="prop" data-id="${id}">Gerar proposta</button></div><textarea id="ai_prop" rows="8" style="margin-top:8px" placeholder="A proposta aparece aqui"></textarea><div class="acts" style="margin-top:6px"><button class="b" data-a="cp" data-s="ai_prop">Copiar proposta</button><button class="g" data-a="close">Fechar</button></div>`)}
function propose(id){const b=find(id),base=+$('#ai_base').value||0,pg=+$('#ai_pg').value||1,ex=$('#ai_sh').checked?400:0,tot=Math.round(base+Math.max(0,pg-3)*150+ex);

function leadModal(id){const l=leads[id];modal(`<h3>${l.b.name}</h3><div class="form"><div><label>Status</label><select id="l_stage">${STAGES.map(s=>`<option ${s===l.stage?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Valor potencial (R$)</label><input id="l_val" type="number" value="${l.value||''}"></div><div><label>Último contato</label><input id="l_last" type="date" value="${l.last}"></div><div><label>Próximo acompanhamento</label><input id="l_next" type="date" value="${l.next}"></div></div><label style="margin-top:8px">Tags (separadas por vírgula)</label><input id="l_tags" value="${l.tags.join(', ')}"><label style="margin-top:8px">Observações</label><textarea id="l_notes" rows="3">${l.notes}</textarea><label style="margin-top:8px">Histórico</label><div class="mu">${l.hist.map(h=>`• ${h}`).join('<br>')||'—'}</div><div class="form" style="margin-top:8px"><input id="l_h" placeholder="Registrar contato (ex.: liguei, sem resposta)"><button class="g" data-a="addh" data-id="${id}">Adicionar</button></div><div class="acts" style="margin-top:12px"><button class="b" style="background:var(--grn)" data-a="sale" data-id="${id}">💰 Registrar venda</button><button class="b" data-a="savel" data-id="${id}">Salvar</button><button class="g" data-a="del" data-id="${id}">Remover</button><button class="g" data-a="close">Fechar</button></div>`)}
const COLS=[['name','Nome'],['cat','Categoria'],['addr','Endereço'],['city','Cidade'],['uf','UF'],['tel','Telefone'],['wa','WhatsApp'],['email','E-mail'],['site','Site'],['ig','Instagram'],['fb','Facebook'],['rating','Nota'],['rev','Avaliações'],['st','Situação'],['src','Fonte'],['date','Verificado em']];

document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-a]');if(!t){if(e.target.id==='modal')close();return}
 if(t.dataset.t){tab=t.dataset.t;render();return}
 const a=t.dataset.a,id=t.dataset.id,b=id&&find(id);
 if(a==='search'){const pais=$('#q_pais').value,q={pais,city:$('#q_city').value.trim()||'Cidade',uf:pais==='BR'?ufc($('#q_uf').value):$('#q_uf').value.trim(),bairro:$('#q_bai').value.trim(),seg:$('#q_seg').value,rad:+$('#q_rad').value||10,qty:Math.min(60,+$('#q_qty').value||12)};LS.set('sf_q',q);results=gen(q);flt={};save();render()}
 else if(a==='close')close();else if(a==='ai')aiModal(id);else if(a==='prop')propose(id);

 else if(a==='map'){sel=id;tab='map';render()}else if(a==='pin'){sel=id;render()}
 else if(a==='ig')window.open('https://instagram.com/'+b.ig.slice(1),'_blank','noopener');
 else if(a==='wa')window.open('https://wa.me/55'+b.wa.replace(/\D/g,''),'_blank','noopener');
 else if(a==='site')window.open('https://'+b.site,'_blank','noopener');
 else if(a==='vcf'){const v=`BEGIN:VCARD\nVERSION:3.0\nFN:${b.name}\nTEL:${b.tel}\nEMAIL:${b.email}\nADR:;;${b.addr};${b.city};${b.uf}\nEND:VCARD`;modal(`<h3>Contato (vCard)</h3><textarea id="vc" rows="8" readonly>${v}</textarea><div class="acts" style="margin-top:8px"><button class="b" data-a="cp" data-s="vc">Copiar</button><button class="g" data-a="close">Fechar</button></div>`)}
